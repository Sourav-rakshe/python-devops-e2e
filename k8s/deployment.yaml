apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
      - name: python-container
        image: sourav-rakshe/python-devops-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
